spring.application.name=relaciones_spring

# H2 en archivo (sin servidor externo; crea ./data/relacionesdb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/relacionesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL de Hibernate en consola
spring.jpa.show-sql=true
# Usa la variable PORT que definen plataformas como Render; sin ella, 8118 en local
server.port=${PORT:8118}
