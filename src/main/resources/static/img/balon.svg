<?xml version="1.0" encoding="UTF-8"?>
<!-- Balón de fútbol estilizado (icono del título). Original. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<radialGradient id="cuero" cx="34%" cy="28%" r="80%">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.72" stop-color="#eef1f6"/>
			<stop offset="1" stop-color="#c9d0dc"/>
		</radialGradient>
	</defs>

	<!-- Esfera -->
	<circle cx="32" cy="31" r="29" fill="url(#cuero)"/>

	<!-- Sombra de curvatura (media luna en el borde inferior) -->
	<path d="M11.5 51.5 A29 29 0 0 0 52.5 51.5 A38 38 0 0 1 11.5 51.5 Z" fill="#1e2634" opacity="0.15"/>

	<!-- Contorno -->
	<circle cx="32" cy="31" r="29" fill="none" stroke="#232b39" stroke-width="2.4"/>

	<g fill="#232b39">
		<!-- Pentágono central -->
		<polygon points="32,22 40.6,28.2 37.3,38.3 26.7,38.3 23.4,28.2"/>
	</g>

	<!-- Costuras hacia el borde -->
	<g stroke="#232b39" stroke-width="2.4" stroke-linecap="round" fill="none">
		<line x1="32" y1="22" x2="32" y2="5"/>
		<line x1="40.6" y1="28.2" x2="59.5" y2="22"/>
		<line x1="37.3" y1="38.3" x2="49.1" y2="54.5"/>
		<line x1="26.7" y1="38.3" x2="14.9" y2="54.5"/>
		<line x1="23.4" y1="28.2" x2="4.5" y2="22"/>
	</g>

	<!-- Brillo pequeño -->
	<ellipse cx="22" cy="16" rx="8" ry="4.5" transform="rotate(-32 22 16)" fill="#ffffff" opacity="0.5"/>
</svg>
