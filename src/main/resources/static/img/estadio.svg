<?xml version="1.0" encoding="UTF-8"?>
<!-- Encabezado (hero): estadio nocturno original, con focos, gradal y césped.
     Forma genérica, sin marcas reales. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
	<defs>
		<linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0a0f22"/>
			<stop offset="0.62" stop-color="#18213d"/>
			<stop offset="1" stop-color="#232c4d"/>
		</linearGradient>
		<radialGradient id="halo" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
			<stop offset="0.35" stop-color="#ffe9b0" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="gradal" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a3358"/>
			<stop offset="1" stop-color="#131a30"/>
		</linearGradient>
		<linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3f7d46"/>
			<stop offset="1" stop-color="#274f2e"/>
		</linearGradient>
		<linearGradient id="cono" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff2c4" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#fff2c4" stop-opacity="0.02"/>
		</linearGradient>
	</defs>

	<!-- Cielo nocturno con estrellas -->
	<rect width="1600" height="900" fill="url(#cielo)"/>
	<g fill="#dfe6ff" opacity="0.5">
		<circle cx="140" cy="90" r="2"/>
		<circle cx="420" cy="60" r="1.6"/>
		<circle cx="840" cy="40" r="1.8"/>
		<circle cx="1220" cy="86" r="1.6"/>
		<circle cx="1480" cy="140" r="2"/>
		<circle cx="640" cy="130" r="1.3"/>
		<circle cx="1020" cy="120" r="1.4"/>
	</g>

	<!-- Graderío (arco del estadio) -->
	<path d="M60 470 Q800 300 1540 470 L1540 640 Q800 480 60 640 Z" fill="url(#gradal)" opacity="0.95"/>
	<path d="M80 480 Q800 315 1520 480" stroke="#5f6f9e" stroke-width="6" fill="none" opacity="0.5"/>
	<path d="M90 560 Q800 415 1510 560" stroke="#5f6f9e" stroke-width="4" fill="none" opacity="0.35"/>

	<!-- Césped con líneas -->
	<ellipse cx="800" cy="700" rx="640" ry="150" fill="url(#cesped)"/>
	<g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" fill="none">
		<ellipse cx="800" cy="700" rx="540" ry="110"/>
		<line x1="260" y1="700" x2="1340" y2="700"/>
		<ellipse cx="800" cy="700" rx="80" ry="26"/>
	</g>

	<!-- Torres de focos pequeñas (traseras) -->
	<g>
		<rect x="552" y="260" width="9" height="230" fill="#10182c"/>
		<rect x="530" y="234" width="54" height="36" rx="8" fill="#1c2542" stroke="#3d4b74" stroke-width="3"/>
		<circle cx="557" cy="252" r="18" fill="url(#halo)"/>
		<polygon points="534,276 430,640 640,640" fill="url(#cono)" opacity="0.18"/>
		<rect x="1039" y="260" width="9" height="230" fill="#10182c"/>
		<rect x="1016" y="234" width="54" height="36" rx="8" fill="#1c2542" stroke="#3d4b74" stroke-width="3"/>
		<circle cx="1043" cy="252" r="18" fill="url(#halo)"/>
		<polygon points="1046,276 960,640 1170,640" fill="url(#cono)" opacity="0.18"/>
	</g>

	<!-- Torres de focos grandes (delanteras) -->
	<g>
		<rect x="188" y="150" width="12" height="330" fill="#10182c"/>
		<rect x="160" y="120" width="68" height="44" rx="8" fill="#1c2542" stroke="#3d4b74" stroke-width="3"/>
		<circle cx="194" cy="142" r="26" fill="url(#halo)"/>
		<g fill="#fff8dc">
			<circle cx="176" cy="136" r="3.5"/>
			<circle cx="194" cy="132" r="3.5"/>
			<circle cx="212" cy="136" r="3.5"/>
			<circle cx="180" cy="150" r="3.5"/>
			<circle cx="198" cy="146" r="3.5"/>
			<circle cx="214" cy="150" r="3.5"/>
		</g>
		<polygon points="160,168 20,660 320,660" fill="url(#cono)" opacity="0.30"/>
		<rect x="1400" y="150" width="12" height="330" fill="#10182c"/>
		<rect x="1372" y="120" width="68" height="44" rx="8" fill="#1c2542" stroke="#3d4b74" stroke-width="3"/>
		<circle cx="1406" cy="142" r="26" fill="url(#halo)"/>
		<g fill="#fff8dc">
			<circle cx="1388" cy="136" r="3.5"/>
			<circle cx="1406" cy="132" r="3.5"/>
			<circle cx="1424" cy="136" r="3.5"/>
			<circle cx="1392" cy="150" r="3.5"/>
			<circle cx="1410" cy="146" r="3.5"/>
			<circle cx="1426" cy="150" r="3.5"/>
		</g>
		<polygon points="1408,168 1280,660 1580,660" fill="url(#cono)" opacity="0.30"/>
	</g>
</svg>
