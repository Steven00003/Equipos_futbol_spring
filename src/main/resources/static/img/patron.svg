<?xml version="1.0" encoding="UTF-8"?>
<!-- Textura sutil repetible (patrón de balones y costuras) para franjas decorativas.
     Los trazos son semitransparentes para superponerse a cualquier franja de color.
     Elementos que NO cruzan los bordes para que el mosaico aplace sin costuras visibles. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
	<g stroke="#ffffff" stroke-opacity="0.30" stroke-width="2" fill="none" stroke-linecap="round">
		<circle cx="10" cy="10" r="3.5"/>
		<circle cx="30" cy="30" r="3.5"/>
		<line x1="24" y1="10" x2="30" y2="10"/>
		<line x1="10" y1="24" x2="10" y2="30"/>
	</g>
	<g fill="#ffffff" fill-opacity="0.22">
		<circle cx="30" cy="10" r="1.4"/>
		<circle cx="10" cy="30" r="1.4"/>
	</g>
</svg>
