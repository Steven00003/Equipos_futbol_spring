# Perfil "cloud" (activalo con SPRING_PROFILES_ACTIVE=cloud, p. ej. en Render)
# Base de datos H2 EN MEMORIA: vive mientras dure el proceso, no hay archivo.
# DatosPruebaRunner la llena al arrancar si esta vacia.
spring.datasource.url=jdbc:h2:mem:relacionesdb;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false
spring.jpa.show-sql=false
